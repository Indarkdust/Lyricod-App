name: Windows

# Builds and tests Lyricod for Windows on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test --project tests/Lyricod.Core.Tests

  build:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        shell: pwsh
        run: |
          # Marked as a test build in About and diagnostics; releases come from release.yml unmarked.
          $build = "${{ github.run_number }}-$($env:GITHUB_SHA.Substring(0, 7))"
          dotnet publish src/Lyricod.App/Lyricod.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o publish/${{ matrix.rid }} "-p:LyricodTestBuild=$build"
      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/package-portable.ps1 -Version $version -Arch '${{ matrix.platform }}' -PublishFolder 'publish/${{ matrix.rid }}' -OutputFolder publish -Label 'test.${{ github.run_number }}'
      - uses: actions/upload-artifact@v7
        with:
          name: Lyricod-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: Lyricod-${{ matrix.rid }}-portable
          path: publish/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

name: Windows release

# Publishes Lyricod for a tag vX.Y.Z:
# builds x64 and ARM64 installers and zips, makes the small updates ("patches") that take the
# portable copy of each of the last three releases to this one, and creates a draft GitHub release
# with the notes in release-notes/X.Y.Z.md. Check the draft, then publish it. The tag must match
# VERSION.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build downloadable artifacts without creating a release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        id: version
        shell: pwsh
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:DRY_RUN -ne 'true') {
            if ($env:RELEASE_REF -ne "refs/tags/v$version") { throw "Tag $env:RELEASE_TAG doesn't match VERSION ($version)" }
            if (-not (Test-Path "release-notes/$version.md")) { throw "No release-notes/$version.md" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test --project tests/Lyricod.Core.Tests
      - name: Find Inno Setup 6
        id: inno
        shell: pwsh
        run: |
          # Hosted Windows images normally include Inno Setup. Fall back to a pinned package.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          Write-Host "Using $iscc"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
      - name: Publish, zip and build installers
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          foreach ($target in @(@{ Platform = 'x64'; Rid = 'win-x64'; Name = 'x64' }, @{ Platform = 'ARM64'; Rid = 'win-arm64'; Name = 'arm64' })) {
            $out = "publish/$($target.Name)/Lyricod"
            # No debug symbols in what people download.
            dotnet publish src/Lyricod.App/Lyricod.App.csproj -c Release -p:Platform=$($target.Platform) -r $($target.Rid) -p:DebugType=none -o $out
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $($target.Rid)" }
            ./scripts/package-portable.ps1 -Version $version -Arch $target.Name -PublishFolder $out -OutputFolder publish
            # Resolve the payload path: ISCC otherwise resolves paths relative to the script.
            $source = (Resolve-Path $out).Path
            & $env:ISCC "/DAppVersion=$version" "/DArch=$($target.Name)" "/DSourceDir=$source" installer/Lyricod.iss
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed for $($target.Name)" }
            if (-not (Test-Path "publish/Lyricod-$version-windows-$($target.Name)-setup.exe")) {
              throw "Installer missing for $($target.Name)"
            }
          }
          Get-ChildItem publish/* -Include *.zip, *-setup.exe | Select-Object Name, Length
      - name: Make patches from the last releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A portable copy of one of these versions downloads only the files that changed since.
          # Each patch is applied to the old zip here and is kept only if that gives the new one
          # exactly, and if it is under half the whole zip. Patches only save a download: a
          # release goes ahead without any that can't be made, and those copies get the whole zip.
          $version = '${{ steps.version.outputs.version }}'
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::No patches: the releases could not be listed'; $tags = @() }
          $earlier = @($tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and [version]$_.Substring(1) -lt [version]$version } |
            Sort-Object { [version]$_.Substring(1) } -Descending | Select-Object -First 3)
          foreach ($tag in $earlier) {
            foreach ($arch in 'x64', 'arm64') {
              $old = "Lyricod-$($tag.Substring(1))-windows-$arch.zip"
              gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $old --dir publish/earlier
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::No patch from $tag for ${arch}: $old could not be downloaded"; continue }
              dotnet run --project tools/Lyricod.Patch -c Release -- "publish/earlier/$old" "publish/Lyricod-$version-windows-$arch.zip" publish
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::No patch from $tag for ${arch}: the tool refused it" }
            }
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem publish/patch-*.zip -ErrorAction SilentlyContinue | Select-Object Name, Length
      - name: Upload downloads for testing
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: Lyricod-${{ steps.version.outputs.version }}-windows
          path: |
            publish/*.zip
            publish/*-setup.exe
          if-no-files-found: error
          compression-level: 0
      - name: Draft the release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $assets = (Get-ChildItem publish/* -Include *.zip, *-setup.exe).FullName
          $whole = @($assets | Where-Object { (Split-Path $_ -Leaf) -notlike 'patch-*' })
          if ($whole.Count -ne 4) { throw "Expected two zips and two installers, found $($whole.Count)" }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "Lyricod $version" --notes-file "release-notes/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
